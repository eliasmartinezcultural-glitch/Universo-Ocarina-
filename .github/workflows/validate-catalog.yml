name: Validate catalog

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate JSON and catalog rules
        run: |
          node -e "JSON.parse(require('node:fs').readFileSync('data/catalogo.json','utf8')); JSON.parse(require('node:fs').readFileSync('data/catalogo.schema.json','utf8')); console.log('JSON válido')"
          node scripts/validate-catalog.mjs
